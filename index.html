<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Gifter - Share Location</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; font-weight: 600; color: #111827; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 15px; margin-bottom: 24px; }
    .status { margin-bottom: 24px; }
    .status-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .status-item:last-child { border-bottom: none; }
    .label { color: #6b7280; font-size: 14px; }
    .value { color: #111827; font-weight: 500; font-size: 14px; word-break: break-word; }
    .address-section { margin-top: 24px; padding: 16px; background: #f9fafb; border-radius: 10px; border-left: 4px solid #2563eb; }
    .address-title { font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .address-text { font-size: 15px; color: #111827; line-height: 1.5; word-break: break-word; }
    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 12px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .link-section { margin-top: 24px; padding: 16px; background: #eff6ff; border-radius: 10px; }
    .link-label { font-size: 12px; color: #334155; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .link-url { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 12px; font-family: monospace; font-size: 13px; color: #0f172a; word-break: break-all; cursor: pointer; }
    .link-url:hover { background: #f1f5f9; }
    .hidden { display: none; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .copy-status { font-size: 12px; color: #16a34a; margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
    .copy-status.visible { opacity: 1; }
    .no-location { color: #9ca3af; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gifter</h1>
    <p class="subtitle">Share your location with a friend</p>

    <div class="status">
      <div class="status-item">
        <span class="label">Token</span>
        <span class="value" id="tokenDisplay">Generating…</span>
      </div>
      <div class="status-item">
        <span class="label">Share Link</span>
        <span class="value" id="linkDisplay">Generating…</span>
      </div>
      <div class="status-item">
        <span class="label">Status</span>
        <span class="value" id="statusDisplay">Waiting for friend…</span>
      </div>
    </div>

    <div class="link-section">
      <div class="link-label">Send this link to your friend</div>
      <div class="link-url" id="shareLink" onclick="copyLink()">
        Loading link…
      </div>
    </div>

    <button class="btn btn-secondary" id="copyBtn" onclick="copyLink()">
      Copy Link
    </button>

    <div class="address-section hidden" id="addressSection">
      <div class="address-title">Friend's Location</div>
      <div class="address-text" id="friendAddress">Friend is at:</div>
    </div>

    <button class="btn btn-primary hidden" id="generateBtn" onclick="generateNewToken()">
      Generate New Link
    </button>

    <button class="btn btn-secondary hidden" id="stopBtn" onclick="stopSharing()">
      Stop Sharing
    </button>
  </div>

  <script>
    // ============================================
    // STATE
    // ============================================
    let currentToken = '';
    let pollingInterval = null;
    let copyStatusEl = null;

    // ============================================
    // DOM ELEMENTS
    // ============================================
    const tokenDisplay = document.getElementById('tokenDisplay');
    const linkDisplay = document.getElementById('linkDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const shareLink = document.getElementById('shareLink');
    const copyBtn = document.getElementById('copyBtn');
    const addressSection = document.getElementById('addressSection');
    const friendAddress = document.getElementById('friendAddress');
    const generateBtn = document.getElementById('generateBtn');
    const stopBtn = document.getElementById('stopBtn');

    // ============================================
    // INITIALIZATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      createCopyStatus();
      generateNewToken();
    });

    function createCopyStatus() {
      copyStatusEl = document.createElement('span');
      copyStatusEl.className = 'copy-status';
      copyStatusEl.textContent = 'Copied!';
      copyBtn.parentNode.insertBefore(copyStatusEl, copyBtn.nextSibling);
    }

    // ============================================
    // GENERATE TOKEN
    // ============================================
    async function generateNewToken() {
      try {
        // POST to /.netlify/functions/share with no token - server generates one
        const response = await fetch('/.netlify/functions/share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat: 0, lon: 0, address: 'initial' })
        });

        const data = await response.json();
        currentToken = data.token;

        // Update display
        tokenDisplay.textContent = currentToken;
        const baseUrl = window.location.origin;
        const fullLink = `${baseUrl}/share.html?token=${currentToken}`;
        shareLink.textContent = fullLink;
        linkDisplay.textContent = fullLink;

        // Reset status
        statusDisplay.textContent = 'Waiting for friend…';
        statusDisplay.className = 'value no-location';

        // Show/hide buttons
        addressSection.classList.add('hidden');
        generateBtn.classList.remove('hidden');
        stopBtn.classList.remove('hidden');

        // Start polling
        startPolling();

      } catch (err) {
        console.error('Error generating token:', err);
        statusDisplay.textContent = 'Error - check if server is running';
        statusDisplay.className = 'value';
      }
    }

    // ============================================
    // POLLING
    // ============================================
    function startPolling() {
      if (pollingInterval) clearInterval(pollingInterval);

      pollingInterval = setInterval(pollFriendLocation, 30000);
      pollFriendLocation(); // Immediate first poll
    }

    async function pollFriendLocation() {
      if (!currentToken) return;

      try {
        const response = await fetch(`/.netlify/functions/share/${currentToken}`);

        if (response.ok) {
          const data = await response.json();
          if (data.address && data.address !== 'initial') {
            // Friend's location received
            friendAddress.textContent = data.address;
            addressSection.classList.remove('hidden');
            statusDisplay.textContent = 'Location received!';
            statusDisplay.className = 'value';
          }
        } else {
          const error = await response.json();
          if (error.error === 'Sharing ended') {
            statusDisplay.textContent = 'Sharing stopped';
            statusDisplay.className = 'value';
          } else if (error.error === 'Token not found or expired') {
            // Still waiting
            statusDisplay.textContent = 'Waiting for friend…';
            statusDisplay.className = 'value no-location';
          }
        }
      } catch (err) {
        // Network error - server might be down
        console.error('Poll error:', err);
        statusDisplay.textContent = 'Connection error – retrying…';
        statusDisplay.className = 'value';
      }
    }

    // ============================================
    // COPY LINK
    // ============================================
    async function copyLink() {
      try {
        await navigator.clipboard.writeText(shareLink.textContent);
        copyStatusEl.classList.add('visible');
        setTimeout(() => copyStatusEl.classList.remove('visible'), 2000);
      } catch (err) {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = shareLink.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        copyStatusEl.classList.add('visible');
        setTimeout(() => copyStatusEl.classList.remove('visible'), 2000);
      }
    }

    // ============================================
    // STOP SHARING
    // ============================================
    async function stopSharing() {
      if (!currentToken) return;

      try {
        await fetch(`/.netlify/functions/stop/${currentToken}`, { method: 'POST' });
        statusDisplay.textContent = 'Sharing stopped';
        addressSection.classList.add('hidden');
        clearInterval(pollingInterval);
      } catch (err) {
        console.error('Stop error:', err);
      }
    }
  </script>
</body>
</html>
