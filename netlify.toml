# Netlify Configuration
# Build settings and function configuration

[build]
  # No build command needed - static files only
  command = ""
  # Publish directory (root where index.html, share.html are)
  publish = "."

[functions]
  # Directory containing serverless functions
  directory = "netlify/functions"
  # Optional: node version
  node_bundler = "esbuild"

# Redirects for cleaner URLs
[[redirects]]
  from = "/api/share/:token"
  to = "/.netlify/functions/share/:token"
  status = 200

[[redirects]]
  from = "/api/location/:token"
  to = "/.netlify/functions/share/:token"
  status = 200

[[redirects]]
  from = "/api/stop/:token"
  to = "/.netlify/functions/stop/:token"
  status = 200

# Optional: Health check endpoint
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/share/health"
  status = 200

# Headers for CORS and security
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"