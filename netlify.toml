# Netlify Configuration
# Build settings and function configuration

[build]
  # Build command for Netlify
  command = ""
  # Publish directory (root where index.html, share.html are)
  publish = "."
  # Functions directory
  functions = "netlify/functions"

# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects for cleaner URLs
[[redirects]]
  from = "/api/share/:token*"
  to = "/.netlify/functions/share/:token"
  status = 200
  force = true

[[redirects]]
  from = "/api/location/:token"
  to = "/.netlify/functions/share/:token"
  status = 200
  force = true

[[redirects]]
  from = "/api/stop/:token"
  to = "/.netlify/functions/stop/:token"
  status = 200
  force = true

# Headers for CORS and security
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Default headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"